name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation, skills and provenance
        run: |
          python3 scripts/verify-docs.py
          python3 -m unittest discover -s scripts -p 'test_docs.py' -v
          python3 scripts/verify-engineering-skills.py
          python3 -m unittest discover -s scripts -p 'test_engineering_skills.py' -v
          git diff --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - name: Verify generated API is committed
        run: git diff --exit-code -- api/openapi.yaml src/api/generated/schema.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Build production bundle
        env:
          VITE_API_URL: https://international-drift-hub.com
        run: npm run build

  browser-suites:
    name: browser-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: photo
            command: npm run test:photos:browser
            artifact: photo-qa-screenshots
            path: artifacts/photo-qa/
          - suite: public
            command: npm run test:public:browser
            artifact: public-qa-screenshots
            path: artifacts/public-qa/
          - suite: help
            command: node scripts/help-browser-check.mjs
            artifact: help-qa-screenshots
            path: artifacts/photo-qa/
          - suite: compare
            command: npm run test:compare:browser
            artifact: compare-qa-screenshots
            path: artifacts/compare-qa/
          - suite: suspension-links
            command: npm run test:links:browser
            artifact: links-qa-screenshots
            path: artifacts/links-qa/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run ${{ matrix.suite }} browser suite
        run: ${{ matrix.command }}
      - name: Upload ${{ matrix.suite }} QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: ignore

  # Preserve the existing required-check name; no branch-protection migration.
  photo-browser:
    if: always()
    needs: browser-suites
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser suite to succeed
        env:
          BROWSER_RESULT: ${{ needs.browser-suites.result }}
        run: test "$BROWSER_RESULT" = success
