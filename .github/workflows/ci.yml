name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation, skills and provenance
        run: |
          python3 scripts/verify-docs.py
          python3 -m unittest discover -s scripts -p 'test_docs.py' -v
          python3 scripts/verify-engineering-skills.py
          python3 -m unittest discover -s scripts -p 'test_engineering_skills.py' -v
          git diff --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - name: Verify generated API is committed
        run: git diff --exit-code -- api/openapi.yaml src/api/generated/schema.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Build production bundle
        env:
          VITE_API_URL: https://international-drift-hub.com
        run: npm run build

  photo-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:photos:browser
      - run: npm run test:public:browser
      - name: Upload photo QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-qa-screenshots
          path: |
            artifacts/photo-qa/
            artifacts/public-qa/
          if-no-files-found: ignore
